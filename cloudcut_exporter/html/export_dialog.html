<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>CloudCut</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="hdr">
    <div class="mark"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2h8v17.5L12 22l-4-2.5z"/><path d="M8.7 8.6h6.6"/><path d="M8.5 14q3.6-1.7 7.1-4"/><path d="M8.5 18.9q3.6-1.7 7.1-4.4"/></svg></div>
    <div class="title" id="app-title">CloudCut</div>
    <div class="ver" id="app-version">&nbsp;</div>
  </div>
  <div class="eyebrow"><span class="dot"></span>SketchUp Exporter</div>

  <div class="card">
    <div class="sec-eyebrow">Detected Parts <span class="count" id="partsCount"></span></div>
    <div id="partsList" class="parts"></div>
  </div>

  <div class="card">
    <div class="sec-eyebrow">Units</div>
    <div class="seg">
      <input type="radio" name="units" value="mm" id="unitMm" checked onchange="refreshDisplay()"><label for="unitMm">Millimeters</label>
      <input type="radio" name="units" value="in" id="unitIn" onchange="refreshDisplay()"><label for="unitIn">Inches</label>
    </div>
  </div>

  <div class="card">
    <div class="sec-eyebrow">Material</div>
    <div id="materialFilters" class="chips"></div>
  </div>

  <div class="card">
    <div class="sec-eyebrow">Thickness</div>
    <div id="thicknessFilters" class="chips"></div>
  </div>

  <div class="btn-row">
    <button class="btn btn-ghost" id="cancelBtn" onclick="doCancel()">Cancel</button>
    <button class="btn btn-primary" id="exportBtn" onclick="doExport()">Export</button>
  </div>

  <script src="dialog.js"></script>
</body>
</html>
